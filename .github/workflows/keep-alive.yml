name: Keep API awake

# Render's free web service sleeps after 15 minutes without traffic, which would pause the BullMQ
# workers (alerts) and the weekly ANP schedule. A light ping keeps it running.
# Notes:
#  - GitHub's cron is best effort and can be delayed, so this reduces sleeping but does not
#    guarantee it. A paid always-on instance is the real fix.
#  - GitHub disables scheduled workflows after 60 days without repository activity.
#  - Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.API_URL }}
        # A cold start takes about a minute, hence the long timeout and the retries.
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 "$API_URL/health"
