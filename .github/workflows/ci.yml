name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bomba
          POSTGRES_PASSWORD: bomba
          POSTGRES_DB: bomba_certa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bomba -d bomba_certa"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://bomba:bomba@localhost:5432/bomba_certa?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-secret-with-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bomba-certa/shared build
      - run: pnpm --filter @bomba-certa/api prisma:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @bomba-certa/api test
      - run: pnpm --filter @bomba-certa/shared test
      - run: pnpm --filter @bomba-certa/mobile test
      - run: pnpm --filter @bomba-certa/web test
      - run: pnpm --filter @bomba-certa/web build
      - run: pnpm --filter @bomba-certa/web build-storybook
      - run: pnpm --filter @bomba-certa/mobile export
      - run: pnpm --filter @bomba-certa/api test:e2e

  # Proves the production image still builds (nothing is pushed or deployed from here).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
