# Render Blueprint: infrastructure as code for the API and its Redis.
# PostgreSQL (with PostGIS) lives on Neon; the web app is a Render static site. See DEPLOY.md.
#
# NOTE: written from Render's Blueprint reference but NOT validated against Render (no CLI/account
# here). If the dashboard rejects a field, DEPLOY.md lists the equivalent manual settings.

services:
  # React app (Vite build), served as static files. SPA fallback + PWA-friendly cache headers.
  - type: web
    name: bomba-certa-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @bomba-certa/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        value: https://bomba-certa-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=(), payment=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache

  - type: web
    name: bomba-certa-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Cheap liveness check, no dependencies touched.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Behind Render's proxy: without this every user shares one IP for rate limiting.
      - key: TRUST_PROXY
        value: 'true'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bomba-certa-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Neon POOLED connection (host contains "-pooler"), used by the running app.
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT connection, used only to run migrations on boot.
      - key: DIRECT_URL
        sync: false
      # The static site below (CORS must allow exactly this origin).
      - key: CORS_ORIGIN
        value: https://bomba-certa-web.onrender.com
      # Turn on only after confirming the dataset link (see DEPLOY.md).
      - key: ANP_IMPORT_ENABLED
        value: 'false'
      - key: ANP_DATASET_URL
        sync: false
      # Optional: e-mail for price alerts (any SMTP provider).
      - key: SMTP_URL
        sync: false

  # BullMQ queues live here. The free instance is in-memory and may restart: the API re-registers
  # its schedule every hour, and in-flight jobs lost in a restart are acceptable for this app.
  - type: keyvalue
    name: bomba-certa-redis
    plan: free
    # BullMQ needs noeviction: with an LRU policy Redis could evict queue keys under memory pressure.
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal network only
